name: Deploy Pangsuma App to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pangsuma-app-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy existing Cloudflare Pages project
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Deploy static app
        run: npx --yes wrangler@4 pages deploy site --project-name=pangsuma-app --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 37701bf94ab65e121e453b11a23077e9
