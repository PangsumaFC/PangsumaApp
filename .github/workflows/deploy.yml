name: Deploy Pangsuma App to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      apply_manager_migration:
        description: 'Apply approved migration 0004 only; do not deploy'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pangsuma-app-production
  cancel-in-progress: false

jobs:
  tests:
    name: Validate before production preflight
    uses: ./.github/workflows/test.yml

  migrate-manager:
    needs: tests
    if: github.event_name == 'workflow_dispatch' && inputs.apply_manager_migration
    name: Apply approved Manager migration 0004 only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify target, recovery bookmark, and apply only 0004
        run: python3 scripts/migrate-manager-0004.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 37701bf94ab65e121e453b11a23077e9
          CI: 'true'

  deploy:
    needs: tests
    if: github.ref == 'refs/heads/main' && !inputs.apply_manager_migration
    name: Deploy existing Cloudflare Pages project
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node for image decoder dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked runtime dependencies
        run: npm ci --ignore-scripts

      - name: Verify custom domain is already attached (read-only)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 37701bf94ab65e121e453b11a23077e9
        run: |
          set -euo pipefail
          domain="app.pangsumafc.com"
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/pangsuma-app/domains"

          current="$(curl --fail --silent --show-error "$endpoint" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json')"
          if ! jq -e '.success == true' <<< "$current" >/dev/null; then
            jq -c '{success, errors}' <<< "$current" >&2
            exit 1
          fi

          if ! jq -e --arg domain "$domain" 'any(.result[]?; .name == $domain)' <<< "$current" >/dev/null; then
            echo "Refusing to add or change a Pages custom domain from the deploy workflow." >&2
            exit 1
          fi
          record="$(jq -c --arg domain "$domain" '.result[] | select(.name == $domain)' <<< "$current")"
          jq -c '{name, status, validation_status: (.validation_data.status // null), verification_status: (.verification_data.status // null)}' <<< "$record"

      - name: Require auth and profile migrations before deploy (read-only, no migrations)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 37701bf94ab65e121e453b11a23077e9
        run: |
          set -euo pipefail
          # Missing table/columns or unavailable DB permissions must stop this release.
          # Resolve 0002 auth columns even with passkeys disabled or empty tables; return no data.
          if ! npx --yes wrangler@4.151.1 d1 execute pangsuma-app-prod --remote \
            --command "SELECT p.user_id, p.nickname, p.dashboard_position, p.quote, p.photo, p.photo_mime, p.version, s.auth_method, u.webauthn_user_handle FROM user_profiles p CROSS JOIN sessions s CROSS JOIN users u LIMIT 0;" \
            --json > "$RUNNER_TEMP/profile-schema.json" 2> "$RUNNER_TEMP/profile-schema.stderr"; then
            # Emit only allowlisted classifications/codes, never raw API output or credentials.
            python3 -c '
          import pathlib, re, sys
          text = "\n".join(pathlib.Path(p).read_text(errors="replace") for p in sys.argv[1:])
          labels = {"authentication error": "authentication_error", "invalid access token": "invalid_access_token", "permission": "permission_error", "not authorized": "not_authorized", "no such table": "missing_table", "no such column": "missing_column"}
          categories = sorted({label for phrase, label in labels.items() if phrase in text.lower()})
          codes = sorted(set(re.findall(r"\bcode[^0-9\n]{0,12}([0-9]{3,6})\b", text, re.I)))
          print("::error::D1 migration probe failed; categories=" + ",".join(categories or ["unclassified_api_or_cli_failure"]) + "; API codes=" + ",".join(codes or ["unavailable"]))
          ' "$RUNNER_TEMP/profile-schema.json" "$RUNNER_TEMP/profile-schema.stderr"
            exit 1
          fi
          jq -e 'length > 0 and all(.[]; .success == true)' "$RUNNER_TEMP/profile-schema.json" >/dev/null

      - name: Require Manager migration 0004 (read-only)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 37701bf94ab65e121e453b11a23077e9
        run: |
          set -euo pipefail
          npx --yes wrangler@4.151.1 d1 execute pangsuma-app-prod --remote \
            --command "SELECT name, sql FROM sqlite_master WHERE type='trigger' AND name IN ('submissions_user_only', 'submissions_active_account_only');" \
            --json > "$RUNNER_TEMP/manager-schema.json"
          jq -e 'length == 1 and .[0].success == true and (.[0].results | length) == 1 and .[0].results[0].name == "submissions_active_account_only" and (.[0].results[0].sql | contains("active_account_required_to_submit"))' "$RUNNER_TEMP/manager-schema.json" >/dev/null

      - name: Require approved Petty Cash migration 0005 (read-only, no migrations)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 37701bf94ab65e121e453b11a23077e9
        run: |
          set -euo pipefail
          # This gate never applies 0005. Owner approval and a separate controlled migration are required.
          npx --yes wrangler@4.151.1 d1 execute pangsuma-app-prod --remote \
            --command "SELECT t.id, t.manager_id, t.idempotency_key, t.payload_hash, t.amount_idr, t.note, t.created_at, l.topup_id FROM cash_topups t LEFT JOIN cash_ledger l ON l.topup_id=t.id LIMIT 0; SELECT name, sql FROM sqlite_master WHERE type='trigger' AND name IN ('cash_topup_balance_guard','cash_topup_ledger_and_account','cash_topups_append_only_update','cash_topups_append_only_delete','cash_ledger_append_only_update','cash_ledger_append_only_delete','petty_cash_approval_ledger');" \
            --json > "$RUNNER_TEMP/topup-schema.json"
          jq -e 'length == 2 and all(.[]; .success == true) and (.[1].results | length) == 7 and any(.[1].results[]; .name == "cash_topup_ledger_and_account" and (.sql | contains("cash.topup_created")))' "$RUNNER_TEMP/topup-schema.json" >/dev/null

      - name: Require approved financial-control migrations 0006–0008 (read-only)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 37701bf94ab65e121e453b11a23077e9
        run: |
          set -euo pipefail
          # Never apply migrations here. Missing prerequisites block deployment safely.
          npx --yes wrangler@4.151.1 d1 execute pangsuma-app-prod --remote \
            --command "SELECT r.id,r.period_ym,r.discrepancy_idr,s.version,h.payload_hash,n.bytes_blob FROM cash_reconciliations r CROSS JOIN financial_alert_settings s CROSS JOIN financial_settings_changes h CROSS JOIN submission_receipts n LIMIT 0; SELECT name FROM sqlite_master WHERE type='trigger' AND name IN ('cash_reconciliation_creation_audit','cash_reconciliations_append_only_update','cash_reconciliations_append_only_delete','submission_receipts_active_uploader','submission_receipts_max_ten','submission_receipts_append_only_update','submission_receipts_append_only_delete','submission_receipt_created_audit','financial_settings_manager_guard','financial_settings_audit_update','financial_settings_append_only_update','financial_settings_append_only_delete') ORDER BY name LIMIT 12;" \
            --json > "$RUNNER_TEMP/financial-control-schema.json"
          jq -e 'length == 2 and all(.[]; .success == true) and (.[1].results | map(.name) | sort) == ["cash_reconciliation_creation_audit", "cash_reconciliations_append_only_delete", "cash_reconciliations_append_only_update", "financial_settings_append_only_delete", "financial_settings_append_only_update", "financial_settings_audit_update", "financial_settings_manager_guard", "submission_receipt_created_audit", "submission_receipts_active_uploader", "submission_receipts_append_only_delete", "submission_receipts_append_only_update", "submission_receipts_max_ten"]' "$RUNNER_TEMP/financial-control-schema.json" >/dev/null

      - name: Require approved Dropbox metadata and server configuration (read-only)
        run: python3 scripts/check-dropbox-deploy.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 37701bf94ab65e121e453b11a23077e9

      - name: Deploy Pages app with Functions and D1 config
        run: npx --yes wrangler@4.151.1 pages deploy site --project-name=pangsuma-app --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 37701bf94ab65e121e453b11a23077e9
