name: Deploy Pangsuma App to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pangsuma-app-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Deploy existing Cloudflare Pages project
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node for image decoder dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked runtime dependencies
        run: npm ci --ignore-scripts

      - name: Verify custom domain is already attached (read-only)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 37701bf94ab65e121e453b11a23077e9
        run: |
          set -euo pipefail
          domain="app.pangsumafc.com"
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/pangsuma-app/domains"

          current="$(curl --fail --silent --show-error "$endpoint" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json')"
          if ! jq -e '.success == true' <<< "$current" >/dev/null; then
            jq -c '{success, errors}' <<< "$current" >&2
            exit 1
          fi

          if ! jq -e --arg domain "$domain" 'any(.result[]?; .name == $domain)' <<< "$current" >/dev/null; then
            echo "Refusing to add or change a Pages custom domain from the deploy workflow." >&2
            exit 1
          fi
          record="$(jq -c --arg domain "$domain" '.result[] | select(.name == $domain)' <<< "$current")"
          jq -c '{name, status, validation_status: (.validation_data.status // null), verification_status: (.verification_data.status // null)}' <<< "$record"

      - name: Require profile migration before deploy (read-only, no migrations)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 37701bf94ab65e121e453b11a23077e9
        run: |
          set -euo pipefail
          # Missing table/columns or unavailable DB permissions must stop this release.
          if ! npx --yes wrangler@4.151.1 d1 execute pangsuma-app-prod --remote \
            --command "SELECT user_id, nickname, dashboard_position, quote, photo, photo_mime, version FROM user_profiles LIMIT 0;" \
            --json > "$RUNNER_TEMP/profile-schema.json" 2> "$RUNNER_TEMP/profile-schema.stderr"; then
            # Emit only allowlisted classifications/codes, never raw API output or credentials.
            python3 -c '
          import pathlib, re, sys
          text = "\n".join(pathlib.Path(p).read_text(errors="replace") for p in sys.argv[1:])
          labels = {"authentication error": "authentication_error", "invalid access token": "invalid_access_token", "permission": "permission_error", "not authorized": "not_authorized", "no such table": "missing_table", "no such column": "missing_column"}
          categories = sorted({label for phrase, label in labels.items() if phrase in text.lower()})
          codes = sorted(set(re.findall(r"\bcode[^0-9\n]{0,12}([0-9]{3,6})\b", text, re.I)))
          print("::error::D1 migration probe failed; categories=" + ",".join(categories or ["unclassified_api_or_cli_failure"]) + "; API codes=" + ",".join(codes or ["unavailable"]))
          ' "$RUNNER_TEMP/profile-schema.json" "$RUNNER_TEMP/profile-schema.stderr"
            exit 1
          fi
          jq -e 'length > 0 and all(.[]; .success == true)' "$RUNNER_TEMP/profile-schema.json" >/dev/null

      - name: Deploy Pages app with Functions and D1 config
        run: npx --yes wrangler@4.151.1 pages deploy site --project-name=pangsuma-app --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 37701bf94ab65e121e453b11a23077e9
